<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso App de Casal 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="custom-toast-container">
        <div id="custom-toast"></div>
    </div>

    <div id="anniversary-banner" style="display:none;">
        🎉 Parabéns pelo nosso dia! ❤️
    </div>

    <div class="header">
        <div id="counter">0d 0h 0m 0s</div>
        <div id="moedas-count-wrapper">🪙 Moedas do Casal: <span id="moedas-count">0</span></div>
    </div>

    <nav>
        <button class="nav-btn active" onclick="mudarTela('tela-mural', this)">📸 Mural</button>
        <button class="nav-btn" onclick="mudarTela('tela-missoes', this)">🎯 Missões</button>
        <button class="nav-btn" onclick="mudarTela('tela-loja', this)">🍿 Loja</button>
        <button class="nav-btn" onclick="mudarTela('tela-encontros', this)">🌹 Encontros</button>
        <button class="nav-btn" onclick="mudarTela('tela-roleta', this)">🎲 Jogos</button>
    </nav>

    <!-- Tela Mural -->
    <div id="tela-mural" class="app-screen active">
        <button class="action-btn btn-full" onclick="abrirModalGerenciarMural()" style="margin-bottom:20px;">
            ➕ Anexar Nova Lembrança
        </button>
        <div id="mural-container" class="mural-grid"></div>
    </div>

    <!-- Modal Mural (com Upload) -->
    <div id="modal-mural" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h4>Nova Lembrança</h4>
            <div class="form-group">
                <label>Título / Data do Momento:</label>
                <input type="text" id="mural-titulo" placeholder="Ex: Nosso primeiro cinema">
            </div>
            <div class="form-group">
                <label>Anexar Foto ou Vídeo:</label>
                <input type="file" id="mural-media-input" accept="image/*,video/*">
            </div>
            <div class="form-group">
                <label>Mensagem / Descrição:</label>
                <textarea id="mural-legenda" rows="3" placeholder="Escreva sobre este momento especial..."></textarea>
            </div>
            <button class="action-btn btn-full" onclick="salvarLembrancaMural()">💾 Salvar Lembrança</button>
            <button class="action-btn btn-full btn-secondary" onclick="fecharModalMural()">Cancelar</button>
        </div>
    </div>

    <!-- Tela Missões -->
    <div id="tela-missoes" class="app-screen">
        <h3 class="section-title">🎯 Missões Diárias</h3>
        <p class="section-subtitle">Resetam automaticamente todos os dias!</p>
        <div id="lista-missoes"></div>
    </div>

    <!-- Tela Loja -->
    <div id="tela-loja" class="app-screen">
        <h3 class="section-title">🍿 Resgatar Mimos</h3>
        <div id="lista-loja" class="shop-grid"></div>
        
        <hr class="divider">
        <h4 class="section-title">🎟️ Meus Cupons Resgatados</h4>
        <div id="lista-cupons" class="cupons-grid"></div>
    </div>

    <!-- Modal Cupom -->
    <div id="modal-cupom" class="modal-overlay" style="display:none;">
        <div class="modal-content text-center">
            <h3>🎟️ Novo Cupom Gerado!</h3>
            <div id="cupom-detalhe" class="cupom-card"></div>
            <button class="action-btn btn-full" onclick="fecharModalCupom()">Guardar nos Meus Cupons</button>
        </div>
    </div>

    <!-- Tela Encontros -->
    <div id="tela-encontros" class="app-screen">
        <h3 class="section-title">🌹 Agendar Date</h3>
        <div class="form-container">
            <input type="date" id="date-input">
            <input type="time" id="time-input">
            <input type="text" id="place-input" placeholder="Onde vamos?">
            <input type="text" id="notes-input" placeholder="Notas do Date (Ex: Levar casaco)">
            <input type="tel" id="phone-input" placeholder="WhatsApp do amor (Ex: 85999999999)">
            <button class="action-btn" onclick="agendarEncontro()">Enviar Proposta via WhatsApp 🚀</button>
        </div>
    </div>

    <!-- Tela Roleta / Jogos -->
    <div id="tela-roleta" class="app-screen">
        <h3 class="section-title">🎲 O que fazer hoje?</h3>
        <div class="games-container">
            <div id="roulette-display">✨ Girar a sorte ✨</div>
            <button class="action-btn btn-roulette" onclick="rodarRoleta()">Sortear Atividade 🎰</button>
            <button class="btn-romantic-message" onclick="abrirSurpresa()">💖 Mensagem Romântica Surpresa 💖</button>
        </div>
    </div>

    <!-- Biblioteca de Confete -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
